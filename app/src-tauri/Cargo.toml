[package]
name = "nova-pi"
version = "0.1.0"
description = "Nova-PI: 迪普科技 AI 数字员工（pi 内核版）"
authors = ["Nova-PI Team"]
edition = "2021"

[lib]
name = "nova_pi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "rt-multi-thread", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rfd = "0.15"
base64 = "0.22"
