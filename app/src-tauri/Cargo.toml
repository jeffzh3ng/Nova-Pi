[package]
name = "nova-pi"
version = "0.1.21"
description = "Nova: AI 数字员工桌面工作台（pi 内核版）"
authors = ["Nova-PI Team"]
edition = "2021"
default-run = "Nova"

[[bin]]
name = "Nova"
path = "src/main.rs"

[lib]
name = "nova_pi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "rt-multi-thread", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rfd = "0.15"
base64 = "0.22"
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
